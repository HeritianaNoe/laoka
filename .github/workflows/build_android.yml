name: Build & Sign Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Makà ny kaody avy ao amin'ny repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Amboary ny Java JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Omeo alalana handeha ny gradlew
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 4. Build ny Release APK (Unsigned aloha)
      - name: Build Unsigned Release APK
        run: ./gradlew assembleRelease

      # 5. Manao sonia (Sign) ny APK
      - name: Sign APK
        id: sign_app
        uses: rsl/setup-android-keystore@v1
        continue-on-error: true # Na ampiasao rsl/build-android

      # 5b. Fampiasana ny Android Sign Action (Fampiasa matetika indrindra)
      - name: Sign Android APK
        uses: rsl/setup-android-keystore@v1
        continue-on-error: true

      # 6. Raha manao sign amin'ny alalan'ny Keystore feno ianao:
      - name: Sign APK (Custom Step)
        uses: rsl/setup-android-keystore@v1
        continue-on-error: true

name: Build Signed Android APK (Java)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Makà ny kaody
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Amboary ny Java JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Maimaimpoana fahazoan-dalana gradlew
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 4. Decode ny Keystore avy amin'ny GitHub Secrets
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/keystore.jks

      # 5. Build ny Release APK amin'ny Gradle
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # 6. Manao sonia (Sign) ny APK amin'ny Android SDK Build-Tools (apksigner)
      - name: Sign APK
        uses: rsl/setup-android-keystore@v1
        id: sign_app
        with:
          keystore: app/keystore.jks
          keystore-password: ${{ secrets.KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.KEY_ALIAS }}
          key-password: ${{ secrets.KEY_PASSWORD }}
          apk-path: app/build/outputs/apk/release/app-release-unsigned.apk

      # Alternative: Raha mampiasa action mahazatra amin'ny rsl/build-android na sign action hafa:
      - name: Sign Release APK
        uses: rsl/build-android@v1
        continue-on-error: true # na ampiasao uber-apk-signer / android-sign-action

      # Sy ny dingana fanaovana Sign mivantana amin'ny rsl/setup-android-keystore na Android Sign Action azonao ampiasaina tsotra indrindra:
      - name: Sign APK (rsl action)
        uses: rsl/setup-android-keystore@v1
        continue-on-error: true

      # Ohatra fomba tsotra indrindra fampiasa matetika (Android Sign Action):
      - name: Sign APK File
        uses: rsl/setup-android-keystore@v1
        continue-on-error: true

name: Build and Sign Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Mampiditra ny kaody avy ao amin'ny repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Mampiditra ny Java JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Manome fahazoan-dalana hampandeha ny gradlew
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 4. Manao Build ny APK Release (Unsigned)
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # 5. Manao Decode ny Keystore avy amin'ny Secret ary mametraka azy ao amin'ny rakitra temporary
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/keystore.jks

      # 6. Manao sonia (Sign) sy Alignment (zipalign) ny APK
      - name: Sign APK with Android SDK tools
        run: |
          # 1. Batainina ny lalana alehan'ny Android SDK Build-Tools
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          
          # 2. Zipalign ny APK
          $BUILD_TOOLS_DIR/zipalign -v -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/app-release-aligned.apk
            
          # 3. Sign ny APK amin'ny apksigner
          $BUILD_TOOLS_DIR/apksigner sign --ks $RUNNER_TEMP/keystore.jks \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

      # 7. Mampakatra ilay APK efa voa-Sign ho Artifact
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-signed-release
          path: app/build/outputs/apk/release/app-release-signed.apk
          retention-days: 60
      # Ampakaro ao amin'ny GitHub Release ilay APK Signed
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/outputs/apk/release/app-release-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
